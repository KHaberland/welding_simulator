<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MAG Welding Trainer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <canvas id="weld-canvas" aria-label="Схема сварочного процесса, боковой вид"></canvas>
    <aside class="dock" id="controls-panel">
      <section class="readouts" aria-label="Параметры процесса">
        <div class="readout">
          <span class="readout__label">WFS</span>
          <span id="out-wfs" class="readout__value">—</span>
        </div>
        <div class="readout">
          <span class="readout__label">VOLTAGE SET</span>
          <span id="out-voltage-set" class="readout__value">—</span>
        </div>
        <div class="readout">
          <span class="readout__label">ACTUAL V</span>
          <span id="out-actual-v" class="readout__value">--- V</span>
        </div>
        <div class="readout">
          <span class="readout__label">CURRENT</span>
          <span id="out-current" class="readout__value">--- A</span>
        </div>
        <div class="readout readout--stability">
          <span class="readout__label">STABILITY</span>
          <span id="out-stability" class="readout__value" data-stability="---">---</span>
        </div>
      </section>

      <section class="ctrls" aria-label="Управление">
        <div class="ctrl">
          <label class="ctrl__label" for="ctrl-diameter">WIRE Ø</label>
          <select id="ctrl-diameter" class="ctrl__select"></select>
          <span id="val-diameter" class="ctrl__val">—</span>
        </div>
        <div class="ctrl">
          <label class="ctrl__label" for="ctrl-wfs">WIRE FEED</label>
          <input id="ctrl-wfs" class="ctrl__range" type="range" />
          <span id="val-wfs" class="ctrl__val">—</span>
        </div>
        <div class="ctrl">
          <label class="ctrl__label" for="ctrl-voltage">VOLTAGE</label>
          <input id="ctrl-voltage" class="ctrl__range" type="range" />
          <span id="val-voltage" class="ctrl__val">—</span>
        </div>
        <div class="ctrl ctrl--torch">
          <span class="ctrl__label" id="lbl-torch">TORCH MOVEMENT</span>
          <label class="switch">
            <input id="ctrl-torch" type="checkbox" aria-labelledby="lbl-torch" />
            <span class="switch__ui" aria-hidden="true"></span>
          </label>
          <span id="val-torch" class="ctrl__val">OFF</span>
          <span class="ctrl__stick">
            <span class="readout__label">STICK-OUT</span>
            <span id="out-stick">15.0 mm</span>
          </span>
        </div>
      </section>

      <div class="actions">
        <button type="button" id="btn-start" class="btn btn--start">START</button>
        <button type="button" id="btn-stop" class="btn btn--stop" disabled>STOP</button>
        <button type="button" id="btn-reset" class="btn btn--reset">RESET</button>
      </div>
    </aside>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
